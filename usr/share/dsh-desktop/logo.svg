<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="whaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.3" />

  <!-- Harness / Neural Arc lines -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="8,12" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" />

  <!-- Stylized DeepSeek Whale Shape -->
  <g transform="translate(256,256) scale(1.1) translate(-256,-256)">
    <!-- Whale Body -->
    <path d="M 120 280 C 130 200, 210 160, 310 170 C 370 176, 410 210, 420 250 C 400 245, 370 248, 350 260 C 320 278, 290 295, 230 295 C 170 295, 135 290, 120 280 Z" fill="url(#whaleGrad)" />
    
    <!-- Tail Fluke -->
    <path d="M 130 280 C 105 270, 80 245, 75 225 C 85 240, 105 255, 125 262 C 105 270, 85 295, 76 315 C 84 298, 108 285, 130 280 Z" fill="url(#whaleGrad)" />

    <!-- Fin -->
    <path d="M 240 290 C 265 325, 295 345, 315 350 C 305 335, 295 315, 285 293 Z" fill="url(#whaleGrad)" opacity="0.9" />

    <!-- Belly Accent Arc -->
    <path d="M 170 285 C 220 290, 275 285, 335 255 C 310 270, 250 280, 195 280 Z" fill="url(#glowGrad)" />

    <!-- Eye / Neural Spark -->
    <circle cx="370" cy="215" r="9" fill="#ffffff" filter="url(#glow)" />
    <circle cx="370" cy="215" r="4" fill="#0284c7" />

    <!-- Orbiting Network Nodes (Harness) -->
    <circle cx="160" cy="180" r="6" fill="#38bdf8" />
    <circle cx="390" cy="310" r="5" fill="#38bdf8" />
    <circle cx="210" cy="350" r="6" fill="#38bdf8" />

    <line x1="160" y1="180" x2="200" y2="205" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" />
    <line x1="390" y1="310" x2="340" y2="275" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" />
    <line x1="210" y1="350" x2="245" y2="305" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" />
  </g>

  <!-- Typography badge "DSH" -->
  <rect x="196" y="388" width="120" height="34" rx="17" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
  <text x="256" y="411" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#e0f2fe" text-anchor="middle" letter-spacing="3">DSH</text>
</svg>
