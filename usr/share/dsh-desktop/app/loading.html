<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Harness Desktop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem;
      max-width: 450px;
    }
    .logo-box {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-img {
      width: 80px;
      height: 80px;
      z-index: 2;
      filter: drop-shadow(0 4px 16px rgba(56, 189, 248, 0.4));
    }
    .spinner {
      position: absolute;
      width: 96px;
      height: 96px;
      border: 3px solid rgba(56, 189, 248, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.9rem;
      border-radius: 9999px;
      background: rgba(14, 165, 233, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      font-size: 0.8125rem;
      color: #38bdf8;
      font-weight: 500;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: pulse 1.5s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }
    .error-box {
      display: none;
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      font-size: 0.8125rem;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-box">
      <div class="spinner"></div>
      <img class="logo-img" src="../logo.svg" alt="DSH Logo" onerror="this.src='../../icons/hicolor/128x128/apps/dsh-desktop.png'">
    </div>
    <h1>DeepSeek Harness</h1>
    <div class="subtitle">Sandboxed Desktop Workspace</div>
    <div class="status-badge">
      <div class="dot"></div>
      <span id="status-text">Connecting to local daemon...</span>
    </div>
    <div id="update-banner" style="display: none; margin-top: 1rem; padding: 0.4rem 0.8rem; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 6px; font-size: 0.8125rem; color: #38bdf8;">
      <span id="update-banner-text">Update available</span>
    </div>
    <div id="error-box" class="error-box"></div>
  </div>
  <script>
    // Strategy: Read window.__DSH_LOCALE__ injected from Electron main process via executeJavaScript before/after load.
    const DICT = {
      en: {
        subtitle: 'Sandboxed Desktop Workspace',
        connecting: 'Connecting to local daemon...',
        troubleshooter: 'Open Recovery Troubleshooter'
      },
      zh: {
        subtitle: '沙箱桌面工作区',
        connecting: '正在连接本地守护进程…',
        troubleshooter: '打开故障恢复疑难解答'
      }
    };

    function applyLocale(locale) {
      const loc = (locale || window.__DSH_LOCALE__ || 'en').startsWith('zh') ? 'zh' : 'en';
      const strings = DICT[loc] || DICT.en;
      const subtitleEl = document.querySelector('.subtitle');
      if (subtitleEl) subtitleEl.textContent = strings.subtitle;
      const statusEl = document.getElementById('status-text');
      if (statusEl && !window._statusUpdated) statusEl.textContent = strings.connecting;
    }
    window.applyLocale = applyLocale;
    if (typeof window !== 'undefined' && window.__DSH_LOCALE__) {
      applyLocale(window.__DSH_LOCALE__);
    }

    // Simple visual update hook
    window.updateStatus = function(text, isError) {
      window._statusUpdated = true;
      const el = document.getElementById('status-text');
      const errBox = document.getElementById('error-box');
      if (el) el.textContent = text;
      if (isError && errBox) {
        const loc = (window.__DSH_LOCALE__ || 'en').startsWith('zh') ? 'zh' : 'en';
        const strings = DICT[loc] || DICT.en;
        errBox.innerHTML = `<span>${text}</span><br><a href="recovery.html" style="color: #60a5fa; text-decoration: underline; margin-top: 0.5rem; display: inline-block;">${strings.troubleshooter}</a>`;
        errBox.style.display = 'block';
      }
    };

    if (window.dshDesktop && typeof window.dshDesktop.updateAvailable === 'function') {
      window.dshDesktop.updateAvailable().then((res) => {
        if (res && res.available) {
          const banner = document.getElementById('update-banner');
          const bannerText = document.getElementById('update-banner-text');
          if (banner && bannerText) {
            const displayVersion = String(res.version || '').startsWith('v') ? res.version : `v${res.version}`;
            bannerText.textContent = `Update available: ${displayVersion}`;
            banner.style.display = 'inline-block';
          }
        }
      }).catch(() => {});
    }
  </script>
</body>
</html>
